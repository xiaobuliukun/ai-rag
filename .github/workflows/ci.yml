name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.21.0

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Install Linux native compiler
        id: compiler
        run: sudo apt-get update && sudo apt-get install --yes clang

      - name: Enforce dependency audit policy
        run: npm run audit:policy

      - name: Verify project
        id: verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.compiler.outcome == 'success' }}
        run: npm run verify

      - name: Exercise Electron desktop workflows
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          for attempt in 1 2; do
            if xvfb-run -a npm run test:e2e -w packages/desktop; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "Electron E2E failed on attempt $attempt; retrying once."
            sleep 5
          done
