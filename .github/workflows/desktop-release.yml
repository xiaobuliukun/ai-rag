name: desktop-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Run complete release gate
        run: |
          npm run audit:policy
          npm run verify

  build:
    needs: validate
    name: build-${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-15
            platform: mac
            arch: arm64
          - id: macos-x64
            runner: macos-15-intel
            platform: mac
            arch: x64
          - id: windows-x64
            runner: windows-2025
            platform: windows
            arch: x64
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency audit policy
        run: npm run audit:policy

      - name: Test desktop release safeguards
        run: npm run test -w packages/desktop

      - name: Build embedded services
        run: npm run build:desktop

      - name: Build signed and notarized macOS package
        if: matrix.platform == 'mac'
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run release:check:mac
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
          npm run release:verify:mac

      - name: Build and verify signed Windows package
        if: matrix.platform == 'windows'
        working-directory: packages/desktop
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { throw "WINDOWS_CSC_LINK is required" }
          if (-not $env:CSC_KEY_PASSWORD) { throw "WINDOWS_CSC_KEY_PASSWORD is required" }
          npx electron-builder --win nsis portable --x64 --publish never
          $artifacts = Get-ChildItem ../../release/desktop/*.exe
          if ($artifacts.Count -lt 2) { throw "Expected signed NSIS and portable executables" }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($artifact.Name): $($signature.Status)"
            }
          }

      - name: Build Linux package
        if: matrix.platform == 'linux'
        working-directory: packages/desktop
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Sign and verify Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_FINGERPRINT: ${{ secrets.LINUX_GPG_FINGERPRINT }}
        run: |
          test -n "$LINUX_GPG_PRIVATE_KEY" || { echo "LINUX_GPG_PRIVATE_KEY is required" >&2; exit 1; }
          test -n "$LINUX_GPG_FINGERPRINT" || { echo "LINUX_GPG_FINGERPRINT is required" >&2; exit 1; }
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          for asset in release/desktop/*.AppImage release/desktop/*.deb; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --local-user "$LINUX_GPG_FINGERPRINT" \
              --armor --detach-sign "$asset"
            gpg --batch --verify "$asset.asc" "$asset"
          done
          gpg --batch --armor --export "$LINUX_GPG_FINGERPRINT" \
            > release/desktop/Moxu-Linux-Signing-Key.asc
          test -s release/desktop/Moxu-Linux-Signing-Key.asc

      - name: Generate runtime SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release/desktop
          format: cyclonedx-json
          output-file: release/desktop/SBOM-${{ matrix.id }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload platform artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.blockmap
            release/desktop/*.asc
            release/desktop/latest*.yml
            release/desktop/SBOM-*.cdx.json

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install release tooling dependencies
        run: npm ci --ignore-scripts

      - name: Download platform artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: desktop-*
          path: release-input
          merge-multiple: false

      - name: Assemble release and checksums
        run: |
          node scripts/assemble-desktop-release.mjs release-input release-assets
          node scripts/release-artifacts.mjs create release-assets
          node scripts/release-artifacts.mjs verify release-assets

      - name: Upload complete desktop release
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-release-assets
          if-no-files-found: error
          retention-days: 30
          path: release-assets/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download complete desktop release
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: desktop-release-assets
          path: release-assets

      - name: Verify release checksums
        run: node scripts/release-artifacts.mjs verify release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; publish a new version instead of replacing immutable assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "墨序 $GITHUB_REF_NAME"
